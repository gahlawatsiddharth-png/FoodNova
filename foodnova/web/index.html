@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.94)}}@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(14px)}}

.page.enter>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}.page.enter>:nth-child(2){animation-delay:.06s}.page.enter>:nth-child(3){animation-delay:.12s}.page.enter>:nth-child(4){animation-delay:.18s}.page.enter>:nth-child(5){animation-delay:.24s}.page.enter>:nth-child(n+6){animation-delay:.3s}

  .brand,.who,.foot{display:none}.nav{flex:0 0 auto;flex-direction:column;gap:2px;padding:6px 10px;font-size:.65rem;margin:0}.nav.on:before{display:none}.nav .ni{width:30px;height:30px}
  .main{height:auto;min-height:100vh;padding-bottom:78px}header{padding:12px 16px}.hout{display:block;padding:7px 12px}.page{padding:16px 14px;overflow:visible}header h1{font-size:1.1rem}}

<body><div id="root"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEFAULT_DISHES = [
  "Dal Tadka / Dal Fry", "Paneer Butter Masala", "Jeera Rice", "Steamed White Rice",
  "Veg Biryani", "Veg Pulao", "Rajma Masala", "Chole Masala", "Aloo Gobi Sabzi",
  "Mixed Veg Sabzi", "Palak Paneer / Saag", "Bhindi Fry", "Tawa Roti / Chapati",
  "Aloo Paratha", "Puri / Bhatura", "Kadhi Pakora", "Sambhar", "Masala Dosa",
  "Idli", "Lemon Rice / Poha", "Samosa / Kachori", "Chowmein / Noodles",
  "Curd Rice", "Green Salad / Cucumber", "Gulab Jamun", "Watermelon / Cut Fruit"
];
const MEALS = ["breakfast","lunch","dinner"];
const RS = ["Poor taste/flavor","Bad texture/preparation","Excessive portion","Not hungry","Allergy/dietary restriction","Meal timing issue","Not fresh","Personal preference"], EM = ["😖","🍽️","🥘","😌","⚠️","⏰","🚫","❌"];
const COL = ["#22c55e","#84cc16","#eab308","#f97316","#ef4444","#a855f7"];
const YIELD = 0.3;
const isCompostableDish = d => /sabzi|veg|salad|fruit|gobhi|gobi|bhindi|palak|saag|banana|watermelon|papaya|cucumber/i.test(d || "");
const route = e => (e.category == "Unknown / Mixed" || e.category == "No Food Detected") ? "Needs review" : e.untouched ? "Redistribute (if safe)" : isCompostableDish(e.dish_name || e.category) ? "Compost" : "Treatment facility";
let token = localStorage.getItem("fn_token"), S = {}, role = "student", view = "dash", period = 7, filt = {t: "", m: ""}, sat = 0, sq = "", amode = "login", arole = "student", timer;
let foodCam = {stream: null}, autoS3Timer = null;

const dishOptions = () => {
  const menuDishes = ((S.scan && S.scan.menu) || []).map(m => m.dish_name);
  const existing = [...new Set((S.ev || []).map(e => e.dish_name || e.category).filter(Boolean))];
  return [...new Set([...menuDishes, ...existing, ...DEFAULT_DISHES])];
};

async function api(path, body) {
  const r = await fetch("/api/" + path, {method: body ? "POST" : "GET", headers: {"Content-Type": "application/json", Authorization: "Bearer " + token}, body: body && JSON.stringify(body)});
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Something went wrong."); return j;
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const days = n => [...Array(n)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (n - 1 - i)); return d; });
const since = n => { const d = days(n)[0]; d.setHours(0, 0, 0, 0); return d; };
const inDays = (ev, n) => ev.filter(e => new Date(e.ts) >= since(n));
const prevWeek = ev => sum(ev.filter(e => { const d = new Date(e.ts); return d < since(7) && d >= since(14); }));
const sum = ev => ev.reduce((a, e) => a + e.grams, 0), kg = g => (g / 1000).toFixed(2);
const daily = (ev, n) => days(n).map(d => sum(ev.filter(e => e.ts.startsWith(ymd(d)))));
const isToday = e => e.ts.startsWith(ymd(new Date()));
const meal = e => e.meal || (+e.ts.slice(11, 13) < 11 ? "breakfast" : +e.ts.slice(11, 13) < 16 ? "lunch" : "dinner");
const byCat = ev => { const m = {}; ev.forEach(e => { const k = e.dish_name || e.category; m[k] = (m[k] || 0) + e.grams; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
const peak = ev => { const m = {}; ev.forEach(e => m[meal(e)] = (m[meal(e)] || 0) + e.grams); return Object.entries(m).sort((a, b) => b[1] - a[1])[0]; };
const fmt = t => new Date(t).toLocaleString(), opts = a => a.map(x => `<option>${esc(x)}</option>`).join("");
const score = (ev, pend = 0) => Math.max(5, 100 - Math.min(60, Math.round(sum(inDays(ev, 7)) / 25)) - 10 * pend);
const badge = s => s >= 90 ? "Platinum" : s >= 75 ? "Gold" : s >= 50 ? "Silver" : "Bronze";
const ach = (ev, sc, fb) => { const w = sum(inDays(ev, 7)), p = prevWeek(ev);
  return [["🌱","Green Start","Record first waste",ev.length >= 1],["♻️","Recycler","50 waste records",ev.length >= 50],["⭐","Eco Champion","Score above 80",sc > 80],["👑","Platinum","Score above 90",sc > 90],["🏆","Legend","Cut waste 80% vs last week",p > 0 && w <= p * .2],["🌍","Planet Guardian","100 feedbacks",fb >= 100]]; };

function line(vals, labels) {
  const W = 700, H = 230, p = 38, mx = Math.max(1, ...vals), st = (W - p * 2) / (vals.length - 1 || 1), ev = Math.ceil(vals.length / 8), base = H - p;
  const pt = vals.map((v, i) => [p + i * st, H - p - v / mx * (H - p * 2)]);
  const grid = [0, .25, .5, .75, 1].map(f => { const y = H - p - f * (H - p * 2); return `<line x1="${p}" x2="${W - p}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${p - 8}" y="${y + 3}" text-anchor="end">${+(mx * f).toFixed(2)}</text>`; }).join("");
  const path = pt.map((x, i) => (i ? "L" : "M") + x[0] + "," + x[1]).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient><linearGradient id="ls" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4ade80"/></linearGradient></defs>${grid}
  <path d="${path} L${pt[pt.length - 1][0]},${base} L${pt[0][0]},${base} Z" fill="url(#lg)"/><path d="${path}" fill="none" stroke="url(#ls)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pt.map((x, i) => `<circle cx="${x[0]}" cy="${x[1]}" r="3.5" fill="var(--card)" stroke="#4ade80" stroke-width="2"><title>${labels[i]}: ${vals[i]}</title></circle>${i % ev == 0 ? `<text x="${x[0]}" y="${H - 12}" text-anchor="middle">${labels[i]}</text>` : ""}`).join("")}</svg>`;
}
const wd = d => d.toLocaleDateString("en", {weekday: "short"}), md = d => d.toLocaleDateString("en", {month: "short", day: "numeric"});

async function snapS3AndRecognize(silent = false) {
  const s3_ip = (($("#s3ip") && $("#s3ip").value) || (S.scan && S.scan.s3_ip) || "192.168.4.1").trim();

          await reload();
          if (view == "ai") updateAiPanels(); else render();
          return;
        }
      }
    } catch (e) {}
  }

  try {
    const j = await api("food/recognize", {cam_ip: s3_ip});
    if (!silent) toast(`✅ Dish Recognized: ${j.dish_name} (${Math.round(j.confidence * 100)}%)`);

    if (view == "ai") updateAiPanels(); else render();

    if (!silent) toast(x.message);
  }

  toast(j.student_linked ? "Recorded. The student has been notified." : "Saved without a student: the scan expired. Scan the barcode again.");
  camAgain(); try { await reload(); } catch (x) {}
}
let stream = {ctl: null, on: false};
function stopStream() { if (stream.ctl) stream.ctl.abort(); stream.on = false; }
async function startStream() {
  if (S.me.role != "student" || stream.on) return; stream.on = true; stream.ctl = new AbortController();
  try {
    const r = await fetch("/api/stream", {headers: {Authorization: "Bearer " + token}, signal: stream.ctl.signal}), rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const {value, done} = await rd.read(); if (done) break; buf += dec.decode(value, {stream: true}); let i;
      while ((i = buf.indexOf("\n\n")) >= 0) { const c = buf.slice(0, i); buf = buf.slice(i + 2); if (c.startsWith("data: ")) onPush(JSON.parse(c.slice(6))); }
    }
  } catch (x) {}
  stream.on = false; if (token) setTimeout(startStream, 3000);
}
function onPush(n) {
  S.notifs = S.notifs || []; if (S.notifs.some(x => x.id == n.id)) return;
  S.notifs.unshift({id: n.id, message: n.message, ts: n.ts, seen: 0}); toast("🔔 " + n.message);
  if (window.Notification && Notification.permission == "granted") new Notification("FoodNova", {body: n.message});
  bell(); if (["notifs", "dash"].includes(view) && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) render();
}
